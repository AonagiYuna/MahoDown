<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MahoDown</title>
    <!-- Instant native-feel shell before the module graph runs. -->
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #f4f1ea;
        color: #1c1b19;
        font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #app {
          background: #0b0c0f;
          color: #ece8e1;
        }
      }
      .boot-shell {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .boot-bar {
        height: 40px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 13px;
        opacity: 0.72;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        -webkit-app-region: drag;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        .boot-bar {
          border-bottom-color: rgba(255, 255, 255, 0.08);
        }
      }
      .boot-main {
        flex: 1;
        display: grid;
        place-items: center;
        font-size: 13px;
        opacity: 0.55;
        letter-spacing: 0.02em;
      }
    </style>
    <script>
      // Apply cached theme before first paint (set by the app after settings load).
      try {
        var c = JSON.parse(localStorage.getItem("maho.bootCache") || "{}");
        var pref = c.theme || "system";
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.dataset.theme = "dark";
        if (dark) {
          document.documentElement.style.background = "#0b0c0f";
          document.body && (document.body.style.background = "#0b0c0f");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-bar">MahoDown</div>
        <div class="boot-main">正在启动…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
